<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Dark circle -->
  <circle cx="60" cy="60" r="56" fill="#0a0a0f" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="rgba(201,168,76,0.2)" stroke-width="0.5"/>
  <!-- Tuning fork / resonance symbol -->
  <!-- Left prong -->
  <line x1="48" y1="35" x2="48" y2="75" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
  <!-- Right prong -->
  <line x1="72" y1="35" x2="72" y2="75" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="44" y1="75" x2="76" y2="75" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
  <!-- Sound waves -->
  <path d="M55 45 Q50 50 55 55" fill="none" stroke="rgba(201,168,76,0.35)" stroke-width="1" stroke-linecap="round"/>
  <path d="M65 45 Q70 50 65 55" fill="none" stroke="rgba(201,168,76,0.35)" stroke-width="1" stroke-linecap="round"/>
  <!-- Dot at center resonance -->
  <circle cx="60" cy="60" r="2.5" fill="#c9a84c" opacity="0.6"/>
</svg>
