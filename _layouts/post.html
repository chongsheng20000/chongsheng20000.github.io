---
layout: default
---

<article class="post-article">
  <header class="post-article-header">
    <h1 class="post-article-title">{{ page.title }}</h1>
    <time class="post-article-meta" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y · %m · %d" }}</time>
  </header>
  <div class="post-article-body">
    {{ content }}
  </div>
  <a class="post-back" href="{{ "/" | relative_url }}">返回首页</a>
</article>
