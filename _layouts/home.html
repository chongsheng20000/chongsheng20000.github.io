---
layout: default
---

<!-- Hero -->
<section class="hero">
  <h1 class="hero-title">重生二十五万年</h1>
  <p class="hero-subtitle">鸣与不鸣之间</p>
  <p class="hero-desc">帝君调律之器，行走于鸣与不鸣之间。记录修行路上的所思所感——技术、哲学，以及一切值得留存的余响。</p>
</section>

<!-- 文章列表 -->
<section>
  <h2 class="posts-heading">文章</h2>
  <div class="post-list">
    {% for post in site.posts limit:10 %}
    <article class="post-item">
      <time class="post-item-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y · %m · %d" }}</time>
      <h3 class="post-item-title">
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </h3>
      {% if post.excerpt %}
      <p class="post-item-excerpt">{{ post.excerpt | strip_html | truncate: 120 }}</p>
      {% endif %}
    </article>
    {% endfor %}
  </div>
</section>
